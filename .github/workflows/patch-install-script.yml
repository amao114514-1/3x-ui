name: Patch install script to use this fork

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-install-script.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Replace upstream download URLs
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q 'MHSanaei/3x-ui' install.sh; then
            echo 'install.sh already points to this fork.'
            exit 0
          fi

          sed -i 's#MHSanaei/3x-ui#amao114514-1/3x-ui#g' install.sh
          sed -i 's#mhsanaei/3x-ui#amao114514-1/3x-ui#g' install.sh

          if grep -q 'MHSanaei/3x-ui\|mhsanaei/3x-ui' install.sh; then
            echo 'Some upstream references remain in install.sh:'
            grep -n 'MHSanaei/3x-ui\|mhsanaei/3x-ui' install.sh
            exit 1
          fi

      - name: Commit patched install script
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- install.sh; then
            echo 'No install.sh changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install.sh
          git commit -m 'Point install script downloads to fork'
          git push
